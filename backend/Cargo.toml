[workspace]
resolver = "3"
members = ["crates/core", "crates/ev3-c"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# What ships: one code unit with whole-program LTO, no symbols, as EVƎ Cockpit builds its own.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

# ev3-client takes the SHA-256 of the cockpit daemon's binary when it starts one. Unoptimised,
# that took about 30 s on an old Linux laptop, past the 15 s a client waits for a daemon, and
# on ev3-c mcp's one thread it would hold up every other call; EVƎ Cockpit optimises the same
# crates.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

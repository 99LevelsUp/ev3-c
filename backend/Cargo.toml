[workspace]
resolver = "3"
members = ["crates/core", "crates/ev3-c"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# What ships: one code unit with whole-program LTO, no symbols, as EVƎ Cockpit builds its own.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

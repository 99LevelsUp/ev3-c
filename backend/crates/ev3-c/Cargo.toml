[package]
name = "ev3-c"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The `ev3-c` program: what EVƎ Cockpit's `ev3 c …` starts, what `ev3 c mcp` serves to an
# agent, and what EVƎ C's VS Code extension runs for each command.

[lib]
name = "ev3_c"
path = "src/lib.rs"

[[bin]]
name = "ev3-c"
path = "src/main.rs"

[dependencies]
ev3c-core = { path = "../core" }
# EVƎ Cockpit's client of its daemon, at a pinned commit of its repository (not on crates.io).
# The contract comes from it too (`ev3_client::contract`), so the two never differ.
ev3-client = { git = "https://github.com/99LevelsUp/ev3-cockpit", rev = "758e4a208d029a65b99a073191ddd1687cbadb11" }
# The cockpit's channel helpers, at the same commit: a private folder for files the daemon
# writes for EVƎ C, named at random.
ev3-channel = { git = "https://github.com/99LevelsUp/ev3-cockpit", rev = "758e4a208d029a65b99a073191ddd1687cbadb11" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One thread is enough for one command or one MCP client: `rt` with a LocalSet runs the MCP
# requests side by side, `signal` hears Ctrl+C, `io-std`/`io-util` read standard input for
# MCP messages and --events interrupts. The arguments are parsed by hand, as the TypeScript
# backend did with node:util, so no argument crate is needed.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync", "signal", "io-std", "io-util"] }

[dev-dependencies]
ev3c-core = { path = "../core", features = ["test-support"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync", "test-util"] }

[lints]
workspace = true

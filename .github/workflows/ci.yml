name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    extension:
        name: Compile + Lint + Unit
        runs-on: windows-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Audit dependencies
              run: npm audit --audit-level=high --omit=dev

            - name: Compile, lint, and unit tests
              run: npm run test:ci

    runtime:
        name: Native tests + brick runtime
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Native tests
              run: npm run test:native

            - name: Brick runtime build and ELF check
              run: npm run build:runtime

    backend:
        name: Rust backend (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Rust toolchain
              run: rustup component add rustfmt clippy

            - name: Format
              run: cargo fmt --check

            - name: Clippy
              run: cargo clippy --all-targets -- -D warnings

            - name: Tests
              run: cargo test

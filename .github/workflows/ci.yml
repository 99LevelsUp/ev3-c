name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    extension:
        name: Compile + Lint + Unit
        runs-on: windows-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Audit dependencies
              run: npm audit --audit-level=high --omit=dev

            - name: Compile, lint, and unit tests
              run: npm run test:ci

    runtime:
        name: Native tests + brick runtime
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Rust toolchain
              run: rustup toolchain install

            # The repository's build tasks are the Rust xtask in backend/.
            - name: Native tests
              working-directory: backend
              run: cargo run --quiet -p xtask -- native-tests

            - name: Brick runtime build and ELF check
              working-directory: backend
              run: cargo run --quiet -p xtask -- build-runtime

    backend:
        name: Rust backend (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Rust toolchain
              # The release rust-toolchain.toml names, with its components; rustup is on every runner.
              run: rustup toolchain install

            - name: Format
              run: cargo fmt --check

            - name: Clippy
              run: cargo clippy --all-targets -- -D warnings

            - name: Tests
              run: cargo test

            - name: Same crate versions as EVƎ Cockpit
              if: matrix.os == 'ubuntu-latest'
              working-directory: .
              run: node scripts/check-rust-versions.cjs

name: CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    extension:
        name: Compile + Lint + Unit
        runs-on: windows-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Audit dependencies
              run: npm audit --audit-level=high --omit=dev

            - name: Compile, lint, and unit tests
              run: npm run test:ci
